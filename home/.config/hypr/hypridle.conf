general {
    # Evita abrir varios lockers y asegura bloqueo antes de suspender.
    lock_cmd = /home/diego/scripts/hypridle-on-battery.sh lock
    before_sleep_cmd = /home/diego/scripts/hypridle-on-battery.sh lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# La politica se aplica tanto con bateria como con alimentacion externa.
listener {
    timeout = 240
    on-timeout = /home/diego/scripts/hypridle-on-battery.sh lock
}

listener {
    timeout = 300
    on-timeout = /home/diego/scripts/hypridle-on-battery.sh dpms-off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
