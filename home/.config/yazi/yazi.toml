[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8
mouse_events = [ "click", "scroll", "touch", "move", "drag" ]
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800
image_delay = 30
image_filter = "lanczos3"
image_quality = 85

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, desc = "$EDITOR", for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', orphan = true, desc = "Abrir", for = "linux" },
]
reveal = [
  { run = 'dolphin --select "$1"', orphan = true, desc = "Revelar en Dolphin", for = "linux" },
]
play = [
  { run = 'mpv "$@"', orphan = true, desc = "Reproducir", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,ndjson,toml,yaml,yml,xml}", use = "edit" },
  { mime = "inode/empty", use = "edit" },
  { mime = "image/*", use = [ "open", "reveal" ] },
  { mime = "{audio,video}/*", use = [ "play", "open", "reveal" ] },
  { mime = "application/pdf", use = [ "open", "reveal" ] },
]

[tasks]
micro_workers = 10
macro_workers = 25
suppress_preload = true
image_alloc = 536870912
image_bound = [ 0, 0 ]

[input]
cursor_blink = true
cd_title = "Ir a:"
create_title = [ "Crear:", "Crear directorio:" ]
rename_title = "Renombrar:"
filter_title = "Filtrar:"
find_title = [ "Buscar:", "Buscar anterior:" ]
search_title = "Buscar con {n}:"
shell_title = [ "Shell:", "Shell bloqueante:" ]

[confirm]
trash_title = "Mover a la papelera?"
delete_title = "Borrar definitivamente?"
overwrite_title = "Sobrescribir?"
quit_title = "Salir?"

