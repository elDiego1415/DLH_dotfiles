$font_ui = JetBrainsMono Nerd Font
$wallpaper = /home/diego/.config/hypr/current-wallpaper

$bg = rgba(0b1020aa)
$surface = rgba(11111b99)
$surface_soft = rgba(11111b66)
$text = rgba(cdd6f4dd)
$text_dim = rgba(bac2decc)
$subtle = rgba(9399b2cc)
$accent = rgba(cba6f7cc)
$check = rgba(89dcebff)
$fail = rgba(f38ba8ff)
$warn = rgba(f9e2afff)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper

    blur_passes = 3
    blur_size = 7
    noise = 0.011
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0

    color = $bg
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 25
    font_family = $font_ui
    color = $text_dim

    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = $font_ui
    color = $text

    position = 0, 250
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(00000099)
}

image {
    monitor =
    path = $wallpaper
    border_size = 2
    border_color = $accent
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1

    position = 0, 40
    halign = center
    valign = center
}

shape {
    monitor =
    size = 300, 60
    color = $surface_soft
    rounding = -1
    border_size = 0
    border_color = rgba(00000000)
    rotate = 0
    xray = false

    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] whoami
    font_size = 18
    font_family = $font_ui
    color = $text

    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = $accent
    inner_color = $surface
    check_color = $check
    fail_color = $fail
    font_color = $text
    capslock_color = $warn
    numlock_color = $check

    rounding = -1
    fade_on_empty = false
    font_family = $font_ui
    placeholder_text = enter password
    fail_text = $PAMFAIL
    check_text = authenticating...
    hide_input = false

    position = 0, -210
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = $LAYOUT
    font_size = 13
    font_family = $font_ui
    color = $subtle

    position = 0, -270
    halign = center
    valign = center
}
