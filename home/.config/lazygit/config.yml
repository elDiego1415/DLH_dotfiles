gui:
  authorColors:
    "*": "#cba6f7"
  branchColors:
    main: "#a6e3a1"
    master: "#a6e3a1"
    develop: "#89b4fa"
  branchColorPatterns:
    "feature/.+": "#94e2d5"
    "fix/.+": "#f38ba8"
    "hotfix/.+": "#fab387"
  nerdFontsVersion: "3"
  border: rounded
  showFileTree: true
  showIcons: true
  showRandomTip: false
  showBottomLine: false
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#6c7086"
    searchingActiveBorderColor:
      - "#f9e2af"
      - bold
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#313244"
    selectedRangeBgColor:
      - "#45475a"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#a6e3a1"
    markedBaseCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
